[project]
name = "echoloom"
version = "0.1.0"
description = "开源本地 AI MV 流水线：Music3 音乐 + Z-Image 分镜 + H3 视频 + FaceFusion 对口型 + karaoke ASS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
pipeline = [
  "torch>=2.7",
  "torchaudio>=2.5",
  "transformers>=4.57",
  "accelerate>=1.0",
  "soundfile>=0.12",
  "librosa>=0.10",
  "numpy>=1.26",
  "demucs>=4.0",
  "einops>=0.8",
  "diffusers>=0.31",
]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.12",
]
facefusion = [
  "gradio==5.50.0",
  "numpy==2.2.1",
  "onnxruntime-gpu>=1.26",
  "opencv-python==4.13.0.92",
  "tqdm>=4.67",
  "scipy>=1.17",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[project.scripts]
echoloom = "echoloom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echoloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "smoke: 连接真实本地服务的冒烟测试（需 ComfyUI 运行中）",
]
